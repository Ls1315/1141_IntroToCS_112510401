

<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>112510401_Lab3_GuessNum</title>
</head>
<body>

  <!--  h1 must be StudentID_Number Guessing Game -->
  <h1>112510401_Number Guessing Game</h1>

  <div id="result"></div>

  <script>
    // 1~100 隨機答案
    var number = Math.floor(Math.random() * 100) + 1;

    var max = 100, min = 1;
    var attempts = 7;
    var guess;

    while (attempts > 0) {

      // 取得 input 並使用 trim()
      var input = window.prompt(
        "請輸入 " + min + " ~ " + max + " 之間的整數。\n你還有：" + attempts + " 次機會。"
      );

      if (input === null) {
        alert("輸入不可為空！");
        continue;
      }

      input = input.trim();

      // 檢查空字串、不為數字
      if (input === "" || isNaN(input)) {
        alert("請輸入有效的數字！");
        continue;
      }

      guess = Number(input);

      // 檢查是否在有效範圍
      if (guess < min || guess > max) {
        alert("請輸入有效範圍內的數字(不能超出" + min + " 到 " + max + ")！");
        continue;
      }

      // 判斷結果
      if (guess === number) {
        alert("恭喜你猜對了！正確答案是 " + number);
        document.getElementById("result").innerHTML =
          '<img src="images/correct.jpg" alt="Correct" style="width:550px;">';
        break;
      } 
      else if (guess < number) {
        alert("太小了！");
        min = guess;
      } 
      else {
        alert("太大了！");
        max = guess;
      }

      attempts--;
    }

    // 用完所有次數仍未猜中
    if (attempts === 0 && guess !== number) {
      alert("很遺憾，您已用完所有次數！正確答案是 " + number);
      document.getElementById("result").innerHTML =
        '<img src="images/wrong.jpg" alt="Wrong" style="width:550px;">';
    }

  </script>

</body>
</html>
