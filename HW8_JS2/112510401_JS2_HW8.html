<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>112510401_JS2_HW8</title>
    <link rel="stylesheet" href="112510401_JS2_HW8.css">
</head>

<body>
    <div class="calculator">
        <h1>JS Calculator</h1>

        <label>Number 1</label>
        <input id="num1" type="number" placeholder="30">

        <label>Number 2</label>
        <input id="num2" type="number" placeholder="60">

        <label>Operate way?</label>
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <button id="calculate">Add</button>

        <p id="result">Result =</p>
    </div>

    <script src="112510401_JS2_HW8.js"></script>
</body>
</html>
