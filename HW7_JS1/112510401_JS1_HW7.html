<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>112510401_HW7_1A2B</title>
</head>
<body>

  <h1>112510401_1A2B</h1>
  <input type="text" id="userGuess" placeholder="Enter 4 unique digits">
  <button onclick="play()">Guess</button>

  <div id="log">
      <h3>Game Record:</h3>
  </div>

<script>
  // 產生 4 個不重複的數字
  function generateAnswer() {
    const digits = Array.from({ length: 10 }, (_, i) => i.toString());
    let ans = "";
    while (ans.length < 4) {
      const index = Math.floor(Math.random() * digits.length);
      ans += digits.splice(index, 1)[0];
    }
    return ans;
  }

  const answer = generateAnswer();
  let attempts = 0;

  // 檢查輸入是否正確（alert錯誤）
  function isValid(str) {
    // 長度必須是 4
    if (str.length !== 4) {
      alert("請輸入剛好 4 位數字！");
      return false;
    }

    // 必須全部是數字
    if (!/^\d{4}$/.test(str)) {
      alert("輸入必須全部為數字！");
      return false;
    }

    // 數字不能重複
    if (new Set(str).size !== 4) {
      alert("四個數字不能重複！");
      return false;
    }

    return true;
  }

  function checkAB(guess, ans) {
    let A = 0, B = 0;
    for (let i = 0; i < 4; i++) {
      if (guess[i] === ans[i]) A++;
      else if (ans.includes(guess[i])) B++;
    }
    return `${A}A${B}B`;
  }

  function play() {
    const inputField = document.getElementById("userGuess");
    const guess = inputField.value;

    // 驗證輸入
    if (!isValid(guess)) {
      inputField.value = "";
      return;
    }

    attempts++;

    // 得到 A/B 結果
    const result = checkAB(guess, answer);

    // 顯示紀錄
    const log = document.getElementById("log");
    const record = document.createElement("div");
    record.textContent = `第 ${attempts} 次：${guess} → ${result}`;
    log.appendChild(record);

    // 猜對
    if (result === "4A0B") {
      alert(`答對了！總共猜了 ${attempts} 次`);
      document.querySelector("button").disabled = true;
      inputField.disabled = true;
    }

    inputField.value = "";
  }
</script>

</body>
</html>
